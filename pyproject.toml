[project]
name = "realpythonchromadb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "erimarko", email = "marko.developer@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langsmith>=0.14.8",
    "notebook>=7.6.3",
    "openai>=3.31.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
]

[project.scripts]
realpythonchromadb = "realpythonchromadb:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
